name: Assemble cat photo backup
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download verified archive parts
        run: gh release download backup-20261103 --repo "$GITHUB_REPOSITORY" --pattern 'cat-home-photos.zip.part???' --dir parts
      - name: Reassemble and verify original archive
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          paths = sorted(Path('parts').glob('cat-home-photos.zip.part[0-9][0-9][0-9]'))
          expected = [f'cat-home-photos.zip.part{i:03d}' for i in range(1, 36)]
          assert [p.name for p in paths] == expected, 'Incomplete archive parts'
          digest = hashlib.sha256()
          size = 0
          with open('cat-home-photos.zip', 'wb') as output:
              for path in paths:
                  with path.open('rb') as source:
                      while block := source.read(1024 * 1024):
                          output.write(block)
                          digest.update(block)
                          size += len(block)
          assert size == 287988618, 'Archive size mismatch'
          assert digest.hexdigest() == 'e4c6d29a62b89915ddac29d42eab262fc88e01e0aa553ef461c31f4ec5bc04dd', 'Archive SHA256 mismatch'
          print(f'Original archive verified: {size} bytes, SHA256 {digest.hexdigest()}')
      - name: Upload complete original archive
        run: |
          gh release upload backup-20261103 cat-home-photos.zip --repo "$GITHUB_REPOSITORY"
          digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/432579927/assets" --jq '.[] | select(.name == "cat-home-photos.zip") | .digest')
          test "$digest" = 'sha256:e4c6d29a62b89915ddac29d42eab262fc88e01e0aa553ef461c31f4ec5bc04dd'
